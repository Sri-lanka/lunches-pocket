
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/StylePData.css">
    <script src="userjs/data.js"  type="module" defer></script>
    <title>data</title>

</head>

<body>


    <div class="head">
        <div class="img">
            <img src="/img/logo.png" class="logo">
        </div>
        <div class="se">
            <h1>Servicio Nacional de Aprendizaje</h1>
        </div>
    </div>

    <div class="navegate">
        <div class="nav1">
            <a  id="home-btn" class="nav1Icon"><img src="/img/home.png" class="icon" />Home</a>
            <a  id="data-btn" class="nav1Icon"><img src="/img/data.png" class="icon" />Data</a>
            <a  id="history-btn" class="nav1Icon"><img src="/img/history.webp"  class="icon" />History</a>
        </div>
        <div class="nav2">
            <a  id="logout-btn" class="logOut"><img src="/img/logout.png" class="icon" />Log Out</a>
        </div>
    </div>

    <div class="screen">
        <div class="profile">
            <img src="/img/data.png" class="proImg">
            <ul id="user-info">
            </ul>
        </div>
        <div class="cont">
            <button id="updateUser">update</button>
            <table class="table">
                <caption>DATA</caption>
                <thead>
                <tr id="dataUp">    
                </tr>
                <tr id="dataDown">
                </tr>
            </table>
        </div>
    </div>
    <div id="overlay-update" style="display: none;">
        <div id="overlay-update-content">
          <form id="update-form">
            <label for="email">email:</label>
            <input type="email" name="email" id="email">

            <label for="telephone">telephone:</label>
            <input type="number" id="telephone" name="telephone">

            <input type="submit" value="update" id="update-form-btn">
          </form>
        </div>
      </div>
</body>

</html>
