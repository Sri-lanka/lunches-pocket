<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module administrator</title>
    <link rel="stylesheet" href="/css/administation.css">

    <script src="adminjs/listCharacterizationSheet.js" type="module" defer></script>

    <link href="/public/bootstrap-5.3.2-dist/css/bootstrap.css" rel="stylesheet">
</head>

<body class="body">
<div id="tableContainer">
    <div class="header">
        <img src="/img/logo.png" class="logo">
        <p class="title">Administration module</p>

    </div>
    <div class="scream">
        <div class="display">
            <div class="button">
                <label for="databaseTables">
                    <p>Select a table:</p>
                </label>
                <select id="databaseTables" onchange="window.location.href = this.value;">
                    <option value="/src/module-administrator/users" >User</option>
                    <option value="/src/module-administrator/assistence"  >Assistance</option>
                    <option value="/src/module-administrator/authorization"  >Authorization</option>
                    <option value="/src/module-administrator/characterizationSheet" selected >Characterization sheet</option>
                    <option value="/src/module-administrator/message" >Message</option>
                    <option value="/src/module-administrator/program" >Program</option>
                    <option value="/src/module-administrator/userSheet" >User Sheet</option>
                </select>
            </div>
            <div class="nav2">
                <a id="logout-btn" class="logOut"><img src="/img/logout.png" class="icon" />Log Out</a>
            </div>
        </div>
        <div class="container">
            <table class="table table-dark" >
                <input type="text" id="nameProgramInput" placeholder="Find by name program">	
                <button id="filterBtn">Filter</button>
                <p>list Characterization Sheet</p>
                <thead class="thead-dark">
                <tr>
                    <th>Id</th>
                    <th>N° Sheet</th>
                    <th>Id Program</th>
                    <th>Created Date</th>
                    <th>End Date</th>
                
                    <th colspan="2"><center><a id="create-btn"><img src="/img/add.webp" class="icon2 a-button"></a></center></th>
                    </th>
                </tr>
                </thead>
                <tbody id="listCharacterizationSheet">
                </tbody>
            </table>
        </div>
    </div>
</div>



<div id="overlay-update" style="display: none;">
    <div id="overlay-update-content">
        <form id="update-form">
            <input type="text" id="filter-input-update" placeholder="find by program">	
            <input type="button" value="Apply Filter" id="apply-filter-btn-update">
            <br>
            <label for="n°Sheet">N° Sheet:</label>
            <input type="number" name="n°Sheet" id="n_sheetUpdate">

            <label for="program">program:</label>
            <select name="program" id="programUpdate-select"></select>

            <label for="endDate">endDate</label>
            <input type="datetime-local" name="date_endUpdate" id="date_endUpdate">

            <input type="submit" value="update" id="update-form-btn">
            <input type="button" value="Cancel" id="update-form-cancel">
        </form>
    </div>
  </div>



  <div id="overlay-create" style="display: none;">
    <div id="overlay-create-content">

      <form id="create-form">
        <input type="text" id="filter-input" placeholder="find by program">
        <input type="button" value="Apply Filter" id="apply-filter-btn">
        <br>
        <label for="n°sheet">n°sheet:</label>
        <input type="number" name="n°sheet" id="n°sheetCreate">
        <label for="program">program:</label>
        <select name="program" id="programCreate-select"></select>
        <label for="date_end">endDate</label>
        <input type="datetime-local" name="date_endCreate" id="date_endCreate">

        <input type="submit" value="Create" id="create-form-btn">
        <input type="button" value="Cancel" id="create-form-cancel">
      </form>
    </div>
  </div>
  <div id="overlay-delete" style="display: none;">
    <div id="overlay-delete-content">
        <form>
        <label>Are you sure you want to delete this record?</label>
        <input type="submit" value="Delete" id="delete-form-btn">
        <input type="button" value="Cancel" id="delete-form-cancel">
        </form>
    </div>
  </div>
</body>
</html>
