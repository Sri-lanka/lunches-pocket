<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module administrator</title>
    <link rel="stylesheet" href="/css/administation.css">

    <script src="adminjs/listMessage.js" type="module" defer></script>

    <link href="/public/bootstrap-5.3.2-dist/css/bootstrap.css" rel="stylesheet">
</head>

<body class="body">
<div id="tableContainer">
    <div class="header">
        <img src="/img/logo.png" class="logo">
        <p class="title">Administration module</p>

    </div>
    <div class="scream">
        <div class="display">
            <div class="button">
                <label for="databaseTables">
                    <p>Select a table:</p>
                </label>
                <select id="databaseTables" onchange="window.location.href = this.value;">
                    <option value="/src/module-administrator/users" >User</option>
                    <option value="/src/module-administrator/assistence"  >Assistance</option>
                    <option value="/src/module-administrator/authorization"  >Authorization</option>
                    <option value="/src/module-administrator/characterizationSheet" >Characterization sheet</option>
                    <option value="/src/module-administrator/message" selected >Message</option>
                    <option value="/src/module-administrator/program" >Program</option>
                    <option value="/src/module-administrator/userSheet" >User Sheet</option>
                </select>
            </div>
            <div class="nav2">
                <a  id="logout-btn" class="logOut"><img src="/img/logout.png" class="icon" />Log Out</a>
            </div>
        </div>
        <div class="container">
            <table class="table table-dark" >
                <p>list Message</p>
                <thead class="thead-dark">
                <tr>
                    <th>Id</th>
                    <th>Id User</th>
                    <th>Type Message</th>
                    <th>description</th>
                    <th>field</th>
                    <th>Recipient</th>
                    <th>Created Date</th>
                    <th>Update Date</th>
                    
                    <th colspan="3"><center><a id="create-btn"><img src="/img/add.webp" class="icon2 a-button"></a></center></th>
                    </th>
                </tr>
                </thead>
                <tbody id="listMessage">
                </tbody>
            </table>
        </div>
    </div>
</div>
<div id="overlay-update" style="display: none;">
    <div id="overlay-update-content">
        <form id="update-form">
            <label for="description">description:</label>
            <input type="text" id="descriptionUpdate" name="description">
            <label for="field">field:</label>
            <input type="file" id="fieldUpdate" name="field">

            <input type="submit" value="update" id="update-form-btn">
            <input type="button" value="Cancel" id="update-form-cancel">
        </form>
    </div>
  </div>
  <div id="overlay-create" style="display: none;">
    <div id="overlay-create-content">

      <form id="create-form">
        <label for="user">Sender:</label>
        <select name="user" id="user-select"></select>

        <label for="type_message">type_message:</label>
        <select name="type_message" id="type_message">
            <option value="excuse">excuse</option>
            <option value="report">report</option>
       </select>

        <label for="description">description:</label>
        <input type="text" id="descriptionCreate" name="description">
        <label for="field">field:</label>
        <input type="file" id="fieldCreate" name="field">
        <label for="Recipient">Recipient:</label>
        <select name="recipient" id="user-select-reciepient"></select>
        <br>
        <input type="submit" value="Create" id="create-form-btn">
        <input type="button" value="Cancel" id="create-form-cancel">
      </form>
    </div>
  </div>
  <div id="overlay-delete" style="display: none;">
    <div id="overlay-delete-content">
        <form>
        <label>Are you sure you want to delete this record?</label>
        <input type="submit" value="Delete" id="delete-form-btn">
        <input type="button" value="Cancel" id="delete-form-cancel">
        </form>
    </div>
  </div>
  <div id="overlay-show-message" style="display: none;">
    <div id="overlay-show-message-content">
           <div id="cardContainer">
    </div>
</body>
</html>
