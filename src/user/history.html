<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/StylePHistory.css">
  <!-- <script src="userjs/history.js" type="module" defer></script>-->
  <title>history</title>

</head>

<body>

  <div class="body">
    <div class="head">
      <div class="img">
        <img src="/img/logo.png" class="logo">
      </div>
      <div class="se">
        <h1>Servicio Nacional de Aprendizaje</h1>
      </div>
    </div>

    <div class="navegate">
      <div class="nav1">
        <a id="home-btn" class="nav1Icon"><img src="/img/home.png" class="icon" />Home</a>
        <a id="data-btn" class="nav1Icon"><img src="/img/data.png" class="icon" />Data</a>
        <a id="history-btn" class="nav1Icon"><img src="/img/history.webp" class="icon" />History</a>
      </div>
      <div class="nav2">
        <a id="logout-btn" class="logOut"><img src="/img/logout.png" class="icon" />Log Out</a>
      </div>
    </div>

    <div class="screen">

      <div class="profile">
        <img src="/img/data.png" class="proImg">
        <ul id="user-info">
        </ul>
      </div>
      <div class="cont">
        <select name="history" id="history">
          <option value="1" selected>Your Reports</option>
          <option value="2">Your Excuses</option>
          <option value="3">Your Assistance</option>
        </select>

        <div id="tables">
          <table class="tableView" id="tableReport">
            <caption>Reports</caption>
            <thead>
              <tr>
                <th>Sender</th>
                <th>Description</th>
                <th>Date sent</th>
              </tr>
            </thead>
            <tbody id="reportHistory">

            </tbody>
          </table>

          <table class="tableView" id="tableExcuse">
            <caption>Excuses</caption>
            <thead>
              <tr>
                <th>Description</th>
                <th>Date sent</th>
              </tr>
            </thead>

            <tbody id="excuseHistory">

            </tbody>
          </table>

          <table class="tableView" id="tableAssistance">
            <caption>Assistances</caption>
            <thead>
              <tr>
                <th>Date</th>
                <th>Verification</th>
              </tr>
            </thead>

            <tbody id="assistanceHistory">

            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div id="overlay-show-message" style="display: none;">
    <div id="overlay-show-message-content">
      <div id="cardContainer">
      </div>
    </div>

  </div>

  <script src="userjs/history.js" type="module" defer></script>
</body>

</html>
