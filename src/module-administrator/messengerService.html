<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styleAdminHistory.css">
  <!-- <script src="userjs/history.js" type="module" defer></script>-->
  <title>history</title>

</head>

<body>

  <div class="body">
    <div class="head">
      <div class="img">
        <img src="/img/logo.png" class="logo">
      </div>
      <div class="se">
        <h1>Servicio Nacional de Aprendizaje</h1>
      </div>
    </div>

    <div class="navegate">
      <div class="nav1">
        <a id="home-btn" class="nav1Icon"><img src="/img/home.png" class="icon" />Home</a>
        <a id="data-btn" class="nav1Icon"><img src="/img/data.png" class="icon" />Mail</a>
        <a id="module-btn" class="nav1Icon"><img src="/img/history.webp" class="icon" />Module</a>
      </div>
      <div class="nav2">
        <a id="logout-btn" class="logOut"><img src="/img/logout.png" class="icon" />Log Out</a>
      </div>
    </div>

    <div class="screen">

      <div class="profile">
        <img src="/img/data.png" class="proImg">
        <ul id="user-info">
        </ul>
      </div>
      <div class="cont">
        <select name="history" id="history">
          <option value="1" selected>Your Reports</option>
          <option value="2">Reports</option>
          <option value="3">Excuses</option>
        </select>

        <div id="tables">
          <table class="tableView" id="tableYourReport">
            <caption>your Reports </caption>
            <thead>
              <tr>
                <th>Description</th>
                <th>Recipient</th>
                <th>Date sent</th>
                <th><a id="create-btn"><img src="/img/add.webp" class="icon2 a-button"></a></th>
              </tr>
            </thead>
            <tbody id="yourReportHistory">

            </tbody>
          </table>

          <table  class="tableView" id="tableReports">
            <caption>Reports</caption>
            <thead>
              <tr>
                <th>Sender</th>
                <th>Description</th>
                <th>Recipient</th>
                <th colspan="2">Date sent</th>
              </tr>
            </thead>

            <tbody id="reportHistory">

            </tbody>
          </table>

          <table class="tableView" id="tableExcuses">
            <caption>table excuses</caption>
            <thead>
              <tr>
                <th>Sender</th>
                <th>Description</th>
                <th colspan="2">Date sent</th>
              </tr>
            </thead>

            <tbody id="excuseHistory">

            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div id="overlay-update" style="display: none;">
    <div id="overlay-update-content">
      <form id="update-form">
        <label for="verification">verification:</label>
        <input type="checkbox" id="verification" name="verification" required>

        <input type="submit" value="Update" id="update-form-btn">
        <input type="button" value="Cancel" onclick="overlayUpdate.style.display='none';">
      </form>
    </div>
  </div>

  <div id="overlay-create" style="display: none;">
    <div id="overlay-create-content">
      <form id="create-form">
        <label for="description">Description:</label>
        <textarea id="descriptionCreate" name="descriptionCreate" cols="38" rows="10"></textarea>
        <label for="field">field:</label>
        <input type="file" id="fieldCreate" name="fieldCreate">
        <label for="Recipient">Recipient:</label>
        <select name="recipient" id="user-select-reciepient"></select>
        <input type="submit" value="Create" id="create-form-btn">
        <input type="button" value="Cancel" id="create-form-cancel">
      </form>
    </div>
  </div>

  <div id="overlay-show-message" style="display: none;">
    <div id="overlay-show-message-content">
           <div id="cardContainer">
    </div>
  </div>  
  <script src="adminjs/messageService.js" type="module" defer></script>
</body>

</html>
