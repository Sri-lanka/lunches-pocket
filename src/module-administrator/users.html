<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module administrator</title>
    <link rel="stylesheet" href="/css/administation.css">

    <script src="adminjs/listUsers.js" type="module" defer></script>

    <link href="/public/bootstrap-5.3.2-dist/css/bootstrap.css" rel="stylesheet">
</head>

<body class="body">
    <div id="tableContainer">
        <div class="header">
            <img src="/img/logo.png" class="logo">
            <p class="title">Administration module</p>

        </div>
        <div class="scream">
            <div class="display">
                <div class="button">
                    <label for="databaseTables">
                        <p>Select a table:</p>
                    </label>
                    <select class="filter" id="databaseTables" onchange="window.location.href = this.value;">
                        <option value="/src/module-administrator/users" selected>User</option>
                        <option value="/src/module-administrator/assistence">Assistance</option>
                        <option value="/src/module-administrator/authorization">Authorization</option>
                        <option value="/src/module-administrator/characterizationSheet">Characterization sheet</option>
                        <option value="/src/module-administrator/message">Message</option>
                        <option value="/src/module-administrator/program">Program</option>
                        <option value="/src/module-administrator/userSheet">User Sheet</option>
                    </select>
                </div>
                <div class="nav2">
                    <a href="administratorHome.html" class="logOut"><img src="/img/home.png" class="icon2" />home</a>
                    <a id="logout-btn" class="logOut"><img src="/img/logout.png" class="icon2" />Log Out</a>
                </div>
            </div>
            <div class="container">
                <table class="table table-dark">
                    <h2 class="titleTable">lIST USERS</h2>
                    <div class="filter-bar">
                        <input class="filter" type="number" id="userDocumentInput" placeholder="Find by document"
                            min="0">
                        <input type="button" class="filter" id="filterBtn" value="Filter">
                    </div>

                    <thead class="thead-dark">
                        <tr>
                            <th>Id</th>
                            <th>Document</th>
                            <th>T.document</th>
                            <th>Username</th>
                            <th>Name</th>
                            <th>Lastname</th>
                            <th>E-mail</th>
                            <th>Phone</th>
                            <th>State</th>
                            <th>Rol</th>
                            <th colspan="2">
                                <center><a id="create-btn"><img src="/img/add.webp" class="icon a-button"></a></center>
                            </th>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listUsers">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="overlay-update" style="display: none;">
        <div id="overlay-update-content">
            <form class="styled-form" id="update-form">
                <label for="document">Document:</label>
                <input type="number" name="documentUpdate" id="documentUpdate">
                <label for="typeDocument">Type Document:</label>
                <select id="typeDocumentUpdate">
                    <option value="CC">CC</option>
                    <option value="TI">TI</option>
                </select>
                <label for="username">Name:</label>
                <input type="text" name="usernameUpdate" id="usernameUpdate">
                <label for="last_name">Last Name:</label>
                <input type="text" name="last_nameUpdate" id="last_nameUpdate">
                <label for="email">E-mail:</label>
                <input type="email" name="emailUpdate" id="emailUpdate">
                <label for="telephone">Telephone:</label>
                <input type="number" id="telephoneUpdate" name="telephoneUpdate">
                <label for="state">State:</label>
                <select name="stateUpdate" id="stateUpdate">
                    <option value="active">active</option>
                    <option value="disable">disable</option>
                </select>
                <label for="rol">Rol:</label>
                <select name="rolUpdate" id="rolUpdate">
                    <option value="user">user</option>
                    <option value="admin">admin</option>
                    <option value="manager">manager</option>
                </select>
                <label for="oldPassword">old Password:</label>
                <input type="password" name="oldPassword" id="oldPassword">
                <label for="password">Password:</label>
                <div class="password-container">
                <input type="password" name="passwordUpdate" id="passwordUpdate">
                <img src="/img/eye_icon.png" alt="show password" id="toggle-passwordUpdate" class="toggle-password">
                </div>
                <label for="passwordConfirm">Confirm Password:</label>
                <input type="password" name="passwordConfirmUpdate" id="passwordConfirmUpdate">

                <input type="submit" value="update" id="update-form-btn">

                <input type="button" value="Cancel" id="update-form-cancel">
            </form>
        </div>
    </div>
    <div id="overlay-create" style="display: none;">
        <div id="overlay-create-content">
            <form class="styled-form" id="create-form">
                <label for="document">Document:</label>
                <input type="number" name="documentCreate" id="documentCreate" required>
                <label for="type_document">Type Document:</label>
                <select name="typeDocumentCreate" id="typeDocumentCreate">
                    <option value="CC">CC</option>
                    <option value="TI">TI</option>
                </select>
                <label for="username">Name:</label>
                <input type="text" name="usernameCreate" id="usernameCreate">
                <label for="last_name">Last Name:</label>
                <input type="text" name="last_nameCreate" id="last_nameCreate">
                <label for="email">E-mail:</label>
                <input type="email" name="emailCreateCreate" id="emailCreateCreate" required>
                <label for="telephone">Telephone:</label>
                <input type="number" id="telephoneCreate" name="telephoneCreate">
                <label for="state">State:</label>
                <select name="stateCreate" id="stateCreate">
                    <option value="active">active</option>
                    <option value="disable">disable</option>
                </select>
                <label for="rol">Rol:</label>
                <select name="rolCreate" id="rolCreate">
                    <option value="user">user</option>
                    <option value="admin">admin</option>
                    <option value="manager">manager</option>
                </select>
                <label for="password">Password(minium 8 characters):</label>
                <div class="password-container">
                    <input type="password" name="passwordCreate" id="passwordCreate" placeholder="******">
                    <img src="/img/eye_icon.png" alt="show password" id="toggle-password" class="toggle-password">
                </div>
                <label for="passwordConfirm">Confirm Password:</label>

                <input type="password" name="passwordConfirmCreate" id="passwordConfirmCreate" placeholder="******">

                <input type="submit" value="Create" id="create-form-btn">

                <input type="button" value="Cancel" id="create-form-cancel">
            </form>
        </div>
    </div>
    <div id="overlay-delete" style="display: none;">
        <div id="overlay-delete-content">
            <form class="styled-form">
                <label>Are you sure you want to delete this record?</label>
                <input type="submit" value="Delete" id="delete-form-btn">
                <input type="button" value="Cancel" id="delete-form-cancel">
            </form>
        </div>
    </div>
</body>

</html>
