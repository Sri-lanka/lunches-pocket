<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulary</title>
    <script src="formulary.js" type="module" defer></script>
    <link rel="stylesheet" href="/public/css/StyleP.css">
</head>

<img src="/public/Img/backgroudLoggin.jpeg" class="imaF" alt="Background Image">

<body>
    
    <section>
        <div class="signin">
            <div class="content">
                <div>
                    <div class="head">
                        <div>
                            <center><img src="/public/Img/logo.png" class="logo" width="15%"></center>
                        </div>
                        <div class="text">
                            <h1>Servicio Nacional de Aprendizaje</h1>
                        </div>
                    </div>
                    <br>
                    <h2>Sign In</h2>
                    <br>
                    <form id="login-form" class="form">
                        <div class="inputBox">
                            <label for="documentSearch"></label>
                            <input type="number" id="documentSearch" name="document" required><i>Document</i>
                        </div>
                        <div class="inputBox">
                            <label for="email"></label>
                            <input type="email" id="email" name="email" required><i>Email</i>
                        </div>
                        <div class="inputBox">
                            <button><a href="login.html">Login</a></button>
                        </div>
                   
                        <div class="btn-login">
                            <button type="submit" id="send-assistance" class="boton">Send assistance</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
